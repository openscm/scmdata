name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  mypy:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync --all-extras
      # There are still a lot of mypy errors to resolve
      - name: mypy
        continue-on-error: true
        run: MYPYPATH=stubs uv run mypy src

  docs:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync --all-extras --group docs
      - name: docs
        # TODO: Enable -W option once the sphinx warnings are cleared up
        run: uv run sphinx-build --keep-going -T -b html docs/source docs/build

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest" ]
        python-version: [ "3.10", "3.11" ]
    runs-on: "${{ matrix.os }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run tests
        run: |
          uv run pytest -r a -v src tests --doctest-modules --cov=src --cov-report=term-missing --cov-report=xml
          uv run coverage report
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4

  test-xarray-versions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11" ]
        xarray-version: [ "0.18.2", "2025.01", "2025.03" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Test with pytest
        run: |
          uv run --with "xarray==${{ matrix.xarray-version }}" pytest -r a -v src tests

  test-no-plotting:
    # This test makes sure that everything works even if the plotting
    # dependencies aren't installed.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install dependencies (no plotting extras)
        run: uv sync --no-default-groups --extra optional --group tests
      - name: Test with pytest
        run: |
          uv run --no-sync pytest -r a -v src tests

  imports-without-extras:
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest" ]
        python-version: [ "3.10", "3.11" ]
    runs-on: "${{ matrix.os }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install package without extras
        run: uv sync --no-default-groups
      - name: Check importable without extras
        run: uv run --no-sync python scripts/test-install.py

  check-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.10"
      - name: Build package
        run: uv build
      - name: Check build
        run: |
          tar -tvf dist/scmdata-*.tar.gz --wildcards '*scmdata/py.typed'

  check-dependency-licences:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Check licences of dependencies
        shell: bash
        run: |
          ./scripts/check-licences.sh
          cat licence-check.txt
