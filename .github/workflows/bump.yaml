name: Bump version

# Bumps the project version with `uv version --bump`, builds the changelog with
# towncrier, commits, tags and pushes, then lands a follow-up pre-release commit
# on main (e.g. 0.20.0 -> 0.20.1.dev0) so subsequent commits don't share the
# tagged version. This mirrors the process in climate-resource/github-actions,
# vendored here via ./.github/actions/{setup-uv,bump-version}.

on:
  workflow_dispatch:
    inputs:
      bump_rule:
        type: choice
        description: >
          How to bump the version. Whitespace-separated segments are passed to
          `uv version --bump`; from a stable version a prerelease segment must
          be combined with a release segment (e.g. "minor alpha").
        options:
          - patch
          - minor
          - major
          - stable
          - patch alpha
          - patch beta
          - patch rc
          - minor alpha
          - minor beta
          - minor rc
          - major alpha
          - major beta
          - major rc
        required: true

jobs:
  bump_version:
    name: "Bump version and create changelog"
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.11"

      - name: Bump version
        uses: ./.github/actions/bump-version
        with:
          bump-rule: ${{ inputs.bump_rule }}
          commit-email: "ci-runner@scmdata.invalid"
