[project]
name = "scmdata"
version = "0.19.0"
description = "scmdata provides some useful data handling routines for dealing with data related to simple climate models (SCMs aka reduced complexity climate models, RCMs)"
authors = [
    { name = "Jared Lewis", email = "jared.lewis@climate-resource.com" },
    { name = "Zeb Nicholls", email = "zebedee.nicholls@climate-energy-college.org" },
    { name = "Mika Pflüger", email = "mika.pflueger@climate-resource.com" },
]
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
keywords = [
    "data",
    "simple climate model",
    "climate",
    "scm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cftime>=1.5",
    "numpy",
    "openscm-units",
    "packaging",
    "pandas>=1.1",
    "pint",
    "pint-pandas",
    "python-dateutil",
    "tqdm",
    "six",
    "xarray>=2025.12",  # earlier xarray is incompatible with pandas>=3 round-trips
    "typing-extensions",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.7.1",
    "seaborn>=0.12.0",
    "nc-time-axis>=1.2.0",
]
optional = [
    "netCDF4",
    "openpyxl",
    "xlrd",
    "scipy>=1.13",  # first numpy-2-compatible scipy
    "pyam-iamc",
    "joblib",
]
notebooks = [
    "notebook>=7",
]

[project.urls]
Homepage = "https://github.com/openscm/scmdata"
Documentation = "https://scmdata.readthedocs.io"
Repository = "https://github.com/openscm/scmdata"

[dependency-groups]
tests = [
    "pytest>=7.3.1",
    "pytest-benchmark",
    "pytest-cov>=4.0.0",
    "coverage>=7.2.0",
]
docs = [
    "myst-nb>=0.17.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-autodoc-typehints>=1.23.0",
    "sphinx-autodocgen>=1.3",
    "jupytext>=1.14.5",
    "sphinx-copybutton>=0.5.2",
]
dev = [
    "mypy>=1.2.0",
    "ruff>=0.8",
    "pre-commit>=3.3.1",
    "towncrier>=23.6.0",
    "liccheck>=0.9.1",
    "pandas-stubs<3",
    "setuptools<81",  # liccheck imports pkg_resources, removed in setuptools 81
    "pip>=24.2",  # liccheck imports pip internals, not installed in uv venvs by default
    { include-group = "tests" },
    { include-group = "docs" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scmdata"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# Keep the existing gate (the previous .coveragerc, which took precedence, used 90).
fail_under = 90
skip_empty = true
show_missing = true
# Regexes for lines to exclude from consideration in addition to the defaults
exclude_also = [
    # Don't complain about missing type checking code:
    "if TYPE_CHECKING:",
]

[tool.mypy]
strict = true
# show error codes on failure with context
show_error_codes = true
show_error_context = true
# warn if code can't be reached
warn_unreachable = true
# importing following uses default settings
follow_imports = "normal"

# Opt outs
# We don't currently have 100% type coverage so the settings below are temporarily added
disallow_untyped_calls = false
disallow_untyped_defs = false

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--ignore=tests/test_data"
]
testpaths = "tests"
doctest_optionflags ="NORMALIZE_WHITESPACE"

[tool.ruff]
src = ["src"]
target-version = "py311"
# Provide some leeway for long docstrings.
line-length = 110

[tool.ruff.lint]
select = [
    "E",  # pycodestyle error
    "W",  # pycodestyle warning
    "F",  # pyflakes
    "I",  # isort
    "D",  # pydocstyle
    "PL",  # pylint
    "TRY",  # tryceratops
    "NPY",  # numpy rules
    "RUF",  # ruff specifics
    "UP",  # pyupgrade
    "S",  # flake8-bandit
]
unfixable = [
    "PD002",  # Disable autofix for inplace as this often introduces bugs
]
ignore = [
    "D200",  # One-line docstring should fit on one line with quotes
    "D400",  # First line should end with a period
    "TRY003",  # Avoid specifying long messages outside the exception class
    "UP007",  # Keep Optional[X]/Union[X, Y] (consistent with other openscm/CR projects)
    "PLC0415",  # `import` outside top-level is intentional for optional-dependency lazy imports
]

[tool.ruff.lint.per-file-ignores]
"test*.py" = [
    "D",  # Documentation not needed in tests
    "S101",  # S101 Use of `assert` detected
    "PLR0913",  # Too many arguments to function call
    "PLR2004",  # Magic value used in comparison
    "PLR5501",  # Use `elif` instead of `else` then `if`
    "NPY002",  # Replace legacy `np.random.rand`
    "S311",  # Standard pseudo-random generators are not suitable for cryptographic purposes
    "RUF043",  # Pattern passed to pytest.raises(match=) need not be escaped/raw in tests
    "RUF059",  # Unpacked-but-unused variables are common in test fixtures
    "RUF061",  # Allow the legacy pytest.raises form in existing tests
    "PLW0108",  # Lambdas in test helpers are fine for readability
]
"docs/source/notebooks/*" = [
    "D100",  # Missing docstring at the top of file
    "E402",  # Module level import not at top of file
    "S101",  # Use of `assert` detected
    "NPY002",  # Legacy np.random is fine for example notebooks
]
"scripts/*" = [
    "S101" # S101 Use of `assert` detected
]
"src/scmdata/ops.py" = [
    "E501" # Line too long
]
"src/scmdata/processing.py" = [
    "PLR2004" # Magic value used in comparison
]

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.towncrier]
package = "scmdata"
package_dir = "src"
filename = "docs/source/changelog.md"
directory = "changelog/"
title_format = "## scmdata {version} ({project_date})"
underlines = ["", "", ""]
issue_format = "[#{issue}](https://github.com/openscm/scmdata/pulls/{issue})"

  [[tool.towncrier.type]]
  directory = "breaking"
  name = "Breaking Changes"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "deprecation"
  name = "Deprecations"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "feature"
  name = "Features"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "improvement"
  name = "Improvements"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "fix"
  name = "Bug Fixes"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "docs"
  name = "Improved Documentation"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "trivial"
  name = "Trivial/Internal Changes"
  showcontent = false
