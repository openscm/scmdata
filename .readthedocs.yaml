# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build the docs with uv. When build.commands is set, Read the Docs runs these
# commands verbatim and the `sphinx:`/`python:` keys are ignored.
build:
  os: ubuntu-24.04
  tools:
    python: "3.10"
  commands:
    - pip install uv
    - uv sync --all-extras --group docs
    - uv run sphinx-build -T -b html docs/source $READTHEDOCS_OUTPUT/html
